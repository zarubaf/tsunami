[workspace]
members = ["crates/tsunami-core", "crates/tsunami-serve", "."]
resolver = "2"

[package]
name = "tsunami"
version = "0.3.1"
edition = "2021"

[lib]
name = "_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"] }
tsunami-core = { path = "crates/tsunami-core" }
