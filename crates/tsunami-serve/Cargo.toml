[package]
name = "tsunami-serve"
version = "0.3.1"
edition = "2021"

[[bin]]
name = "tsunami-serve"
path = "src/main.rs"

[dependencies]
tsunami-core = { path = "../tsunami-core" }
rmcp = { version = "1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
